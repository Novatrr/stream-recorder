name: Check & Record YouTube Live

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  check-and-record:
    runs-on: ubuntu-latest
    steps:
      - name: Install yt-dlp, ffmpeg, and nodejs
        run: |
          sudo apt update
          sudo apt install -y ffmpeg nodejs
          sudo curl -L https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp -o /usr/local/bin/yt-dlp
          sudo chmod a+rx /usr/local/bin/yt-dlp

      - name: Check if Stream is Live & Record
        run: |
          mkdir -p output
          CHANNEL_URL="${{ secrets.STREAM_URL }}"
          
          STATUS=$(yt-dlp --print live_status "$CHANNEL_URL" 2>/dev/null || echo "not_live")
          echo "Current Live Status: $STATUS"

          if [ "$STATUS" = "is_live" ] || [ "$STATUS" = "is_upcoming" ]; then
            echo "Stream detected! Starting recording..."
            timeout 21000 yt-dlp --live-from-start --wait-for-video 30 -f "bestvideo+bestaudio/best" -o "output/recording_part1.mp4" "$CHANNEL_URL" || true
          else
            echo "No active stream found. Exiting cleanly."
            exit 0
          fi

      - name: Upload Recorded Video Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-stream-recording-part1
          path: output/recording_part1.mp4
          retention-days: 7
