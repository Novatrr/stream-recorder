name: Record YouTube Live

on:
  workflow_dispatch:

concurrency:
  group: youtube-live-recorder
  cancel-in-progress: false

jobs:
  check-and-record:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Deno JS Runtime
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install FFmpeg & Latest yt-dlp
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          pip install --upgrade --no-cache-dir yt-dlp

      - name: Create Output Directory & Write Cookies
        env:
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
        run: |
          mkdir -p output
          if [ -z "$YT_COOKIES" ]; then
            echo "::error ::YT_COOKIES secret is missing or empty in GitHub Settings!"
            exit 1
          fi
          echo "$YT_COOKIES" > cookies.txt

      - name: Record YouTube Live Stream
        run: |
          timeout 21000 yt-dlp \
            --force-ipv4 \
            --cookies cookies.txt \
            --remote-components ejs:github \
            --wait-for-video 30 \
            --live-from-start \
            --fragment-retries infinite \
            --retry-sleep fragment:exp=1:20 \
            --socket-timeout 30 \
            --hls-use-mpegts \
            "https://www.youtube.com/live/jDgMGSAP0PQ?si=FkwoUMMju86q9yY7" \
            -o "output/recording_part1.%(ext)s" || true

      - name: Upload Recording Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: youtube-recording-part1
          path: output/
          retention-days: 7
