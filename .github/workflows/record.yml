name: Check & Record YouTube Live

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  check-and-record:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Dependencies & Latest yt-dlp
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          pip install --upgrade yt-dlp

      - name: Create Output Directory & Load Cookies
        env:
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
        run: |
          mkdir -p output
          echo "$YT_COOKIES" > cookies.txt

      - name: Record YouTube Live Stream
        run: |
          timeout 21000 yt-dlp \
            --live-from-start \
            --cookies cookies.txt \
            "YOUR_STREAM_URL_HERE" \
            -o "output/recording_part1.mp4" || true

      - name: Upload Recording Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: youtube-recording-part1
          path: output/recording_part1.mp4
          retention-days: 7
