name: Record YouTube Live

on:
  schedule:
    # 01:00 AM WIB (18:00 UTC previous day)
    - cron: '0 18 * * *'
  workflow_dispatch: # Allows manual trigger anytime

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - name: Install yt-dlp, ffmpeg, and nodejs
        run: |
          sudo apt update
          sudo apt install -y ffmpeg nodejs
          sudo curl -L https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp -o /usr/local/bin/yt-dlp
          sudo chmod a+rx /usr/local/bin/yt-dlp

      - name: Download YouTube Stream
        run: |
          mkdir -p output
          yt-dlp --live-from-start --wait-for-video 60 -f "bestvideo+bestaudio/best" -o "output/recording.mp4" "${{ secrets.STREAM_URL }}"

      - name: Upload Recorded Video Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-stream-recording
          path: output/recording.mp4
          retention-days: 7
