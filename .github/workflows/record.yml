name: Check & Record YouTube Live

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  check-and-record:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Set up Node.js (for JS challenge solving)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies & Latest yt-dlp
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          pip install --upgrade --no-cache-dir yt-dlp

      - name: Create Output Directory
        run: mkdir -p output

      - name: Record YouTube Live Stream
        run: |
          timeout 21000 yt-dlp \
            --live-from-start \
            --extractor-args "youtube:player_client=tv_downgraded,android_vr,web" \
            --concurrent-fragments 4 \
            "https://www.youtube.com/watch?v=XMJi8I_9pp4" \
            -o "output/recording_part1.mp4" || true

      - name: Upload Recording Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: youtube-recording-part1
          path: output/recording_part1.mp4
          retention-days: 7
