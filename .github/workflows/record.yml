name: Check & Record YouTube Live

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  check-and-record:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Set up Node.js (for YouTube JS Challenge Solver)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies & Latest yt-dlp
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          pip install --upgrade --no-cache-dir yt-dlp

      - name: Create Output Directory & Load Cookies
        env:
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
        run: |
          mkdir -p output
          if [ -n "$YT_COOKIES" ]; then
            echo "$YT_COOKIES" > cookies.txt
          fi

      - name: Record YouTube Live Stream
        run: |
          COOKIE_ARG=""
          if [ -f cookies.txt ]; then
            COOKIE_ARG="--cookies cookies.txt"
          fi

          timeout 21000 yt-dlp \
            --live-from-start \
            $COOKIE_ARG \
            --extractor-args "youtube:player_client=ios,web_creator" \
            --format "bv*+ba/b" \
            "https://www.youtube.com/watch?v=XMJi8I_9pp4" \
            -o "output/recording_part1.mp4" || true

      - name: Upload Recording Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: youtube-recording-part1
          path: output/recording_part1.mp4
          retention-days: 7
