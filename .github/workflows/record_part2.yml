name: Check & Record YouTube Live (Part 2)

on:
  schedule:
    # Runs every 6 hours offset by 5 hours (05:00, 11:00, 17:00, 23:00 UTC)
    - cron: '0 5,11,17,23 * * *'
  workflow_dispatch:

jobs:
  check-and-record-part2:
    runs-on: ubuntu-latest
    steps:
      - name: Install yt-dlp, ffmpeg, and nodejs
        run: |
          sudo apt update
          sudo apt install -y ffmpeg nodejs
          sudo curl -L https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp -o /usr/local/bin/yt-dlp
          sudo chmod a+rx /usr/local/bin/yt-dlp

      - name: Record Stream Part 2
        run: |
          mkdir -p output
          CHANNEL_URL="https://www.youtube.com/@KaelaKovalskia/live"
          
          STATUS=$(yt-dlp --print live_status "$CHANNEL_URL" 2>/dev/null || echo "not_live")

          if [ "$STATUS" = "is_live" ]; then
            echo "Stream is still live! Catching Part 2..."
            timeout 21000 yt-dlp --live-from-start --wait-for-video 30 -f "bestvideo+bestaudio/best" -o "output/recording_part2.mp4" "$CHANNEL_URL" || true
          else
            echo "No active stream for Part 2. Exiting."
            exit 0
          fi

      - name: Upload Recorded Video Artifact (Part 2)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-stream-recording-part2
          path: output/recording_part2.mp4
          retention-days: 7
